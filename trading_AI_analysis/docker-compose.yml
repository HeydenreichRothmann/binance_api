# version: '3.3'

services:
  # docker-compose run --rm nessus_pro
    nessus_pro:
        image: fire_scripts_builder:${PYTHON_VERSION}
        build:
            context: .
            dockerfile: Dockerfile.${PIP_VERSION}

        environment:
            - LD_LIBRARY_PATH:/usr/local/lib/

        working_dir: /builder
        volumes:
            - ./fire_api:/fire_api
            - ./nessus_pro:/builder
            - ./dist/nessus_pro:/dist

        command: bash -c "
                pip${PIP_VERSION} install --root-user-action=ignore --upgrade pip &&
                pip${PIP_VERSION} install --root-user-action=ignore -r requirements.txt &&
                pyinstaller ./src/nessus_pro.py \
                    --name nessus_pro \
                    --onefile \
                    --clean \
                    --workpath ./build/ \
                    --distpath /dist &&
                cp ./src/config_template.json /dist"       

