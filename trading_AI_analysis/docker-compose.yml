    # docker-compose run --rm template
    template:
        image: fire_scripts_builder:${PYTHON_VERSION}
        build:
            context: .
            dockerfile: Dockerfile.${PIP_VERSION}

        working_dir: /builder
        volumes:
            - ./template:/builder
            - ./fire_api:/fire_api
            - ./script_utils:/builder/src/script_utils
            - ./dist/template:/dist
        
        command: bash -c "
            pip${PIP_VERSION} install --root-user-action=ignore --upgrade pip &&
            pip${PIP_VERSION} install --root-user-action=ignore -r requirements.txt &&
            pyinstaller ./src/template_script.py \
                --name template \
                --onefile \
                --clean \
                --workpath ./build/ \
                --distpath /dist \
                --paths=./src \
                --paths=./script_utils/src \
                --hidden-import=logstash_async.transport &&
            cp ./src/config_template.json /dist"




